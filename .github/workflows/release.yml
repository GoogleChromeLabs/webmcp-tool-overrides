name: Build and Release Extension

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
    - name: Get version from manifest
      id: get_version
      run: |
        VERSION=$(jq -r .version manifest.json)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        
    - name: Build extension zip
      env:
        VERSION: ${{ steps.get_version.outputs.version }}
      run: |
        zip -r "webmcp-tool-overrides-${VERSION}.zip" manifest.json background content dashboard engine icons popup storage utils LICENSE README.md
        
    - name: Upload Release Asset
      uses: softprops/action-gh-release@c95d119777ca226d97c3905f1df7ef984501a4db # v2.1.0
      with:
        files: webmcp-tool-overrides-${{ steps.get_version.outputs.version }}.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
