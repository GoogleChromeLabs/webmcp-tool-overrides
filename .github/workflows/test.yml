name: Test WebMCP Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Pytest
      run: |
        pytest tests/
        
    - name: Dump ChromeDriver logs
      if: failure()
      run: |
        if [ -f chromedriver.log ]; then cat chromedriver.log; else echo "chromedriver.log not found"; fi
